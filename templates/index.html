<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eCMS Chatbot</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 20px;
            position: relative;
        }

        #chatIcon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: fixed;
            bottom: 30px; right: 30px;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        #chatIcon:hover { transform: scale(1.1) rotate(10deg); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6); }

        #chatbox {
            width: 420px; height: 0; opacity: 0;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            background: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: fixed;
            bottom: 100px; right: 30px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }
        #chatbox.open { height: 80vh; opacity: 1; }

        .logo-header {
            display: flex; align-items: center;
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .logo-header .logo { height: 40px; width: 40px; margin-right: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }
        .logo-header header { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
        .logo-header .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.9; }
        .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #chatlogs {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
            background: #f8fafc;
        }
        #chatlogs::-webkit-scrollbar { width: 6px; }
        #chatlogs::-webkit-scrollbar-track { background: transparent; }
        #chatlogs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .message { max-width: 85%; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 12px 16px;
            border-radius: 16px 16px 4px 16px;
            font-size: 14px; line-height: 1.5;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .bot-wrapper { align-self: flex-start; display: flex; align-items: flex-end; gap: 8px; }
        .bot {
            background: white; color: #1e293b; padding: 14px 18px;
            border-radius: 16px 16px 16px 4px;
            font-size: 14px; line-height: 1.6;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        .bot strong { color: #667eea; }
        .bot ol, .bot ul { margin: 8px 0; padding-left: 20px; }
        .bot li { margin: 4px 0; }

        .responder-image { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #e2e8f0; object-fit: cover; flex-shrink: 0; }

        .greeting { text-align: center; padding: 30px 20px; animation: fadeIn 0.5s ease; }
        .greeting-image { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 16px; border: 3px solid #e2e8f0; }
        .greeting-text { font-size: 16px; color: #475569; font-weight: 500; }

        .loading-dots {
            display: flex; gap: 4px; padding: 12px 16px;
            background: white; border-radius: 16px 16px 16px 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            width: fit-content;
        }
        .loading-dots span { width: 8px; height: 8px; background: #667eea; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        #highlighted-questions {
            padding: 12px 16px; background: white;
            border-top: 1px solid #e2e8f0;
            display: none; gap: 8px;
            overflow-x: auto; white-space: nowrap;
        }
        #highlighted-questions::-webkit-scrollbar { height: 4px; }
        #highlighted-questions button {
            padding: 8px 14px; border: none;
            background: #f1f5f9; color: #475569;
            font-size: 13px; cursor: pointer;
            border-radius: 20px; font-family: 'Inter', sans-serif;
            transition: all 0.2s; border: 1px solid #e2e8f0;
        }
        #highlighted-questions button:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-color: transparent;
            transform: translateY(-1px);
        }

        .input-area {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 16px; background: white;
            border-top: 1px solid #e2e8f0;
        }
        #userInput {
            flex: 1; padding: 12px 16px;
            border: 1px solid #e2e8f0; border-radius: 24px;
            outline: none; font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s; background: #f8fafc;
        }
        #userInput:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }

        #sendStopButton {
            padding: 12px 20px; border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-radius: 24px;
            cursor: pointer; font-size: 14px;
            font-weight: 500; font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        #sendStopButton:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        #sendStopButton.stopButton { background: #ef4444; }

        #voiceSearchButton {
            width: 40px; height: 40px; border: none;
            background: #f1f5f9; color: #475569;
            border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        #voiceSearchButton:hover { background: #e2e8f0; }
        #voiceSearchButton.active {
            background: #ef4444; color: white;
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } }

        #tryAgainChat {
            display: none; margin: 12px 16px; padding: 12px;
            border: none; background: #fef2f2; color: #ef4444;
            border-radius: 12px; cursor: pointer;
            font-size: 14px; font-weight: 500;
            font-family: 'Inter', sans-serif; transition: all 0.2s;
        }
        #tryAgainChat:hover { background: #fee2e2; }

        .timestamp { font-size: 11px; color: #94a3b8; margin-top: 4px; text-align: right; }
        .bot-wrapper .timestamp { text-align: left; margin-left: 40px; }
    </style>
</head>
<body>
    <div id="chatIcon" onclick="toggleChatbox()">💬</div>
    
    <div id="chatbox">
        <div class="logo-header">
            <img src="/static/images/logo.png" alt="eCMS" class="logo">
            <header>eCMS Assistant</header>
            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </div>
        
        <div id="chatlogs"></div>
        
        <div id="highlighted-questions">
            <button onclick="sendHighlightedQuestion('What is eCMS?')">⚖️ What is eCMS?</button>
            <button onclick="sendHighlightedQuestion('How to register in eCMS?')">📝 How to register?</button>
            <button onclick="sendHighlightedQuestion('How is eCMS related to BTFN?')">💰 eCMS & BTFN</button>
            <button onclick="sendHighlightedQuestion('How does eCMS work?')">How does eCMS work?</button>
        </div>
        
        <div class="input-area">
            <input id="userInput" type="text" placeholder="Ask about eCMS procedures..." autocomplete="off">
            <button id="voiceSearchButton" title="Hold to speak" 
                onmousedown="startVoiceRecognition()" onmouseup="stopVoiceRecognition()">
                <i class="material-icons">mic</i>
            </button>
            <button id="sendStopButton" onclick="toggleSendStop()">Send</button>
        </div>
        
        <button id="tryAgainChat" onclick="restartChat()">🔄 Start New Chat</button>
    </div>

    <script>
        const responderImageUrl = "{{ url_for('static', filename='images/responder.jpg') }}";
        const greetingImageUrl = "{{ url_for('static', filename='images/greetingAI.jpg') }}";
        let recognition;

        const badWords = ['fuck', 'suck', 'dha', 'motherfucker', 'dick', 'thu'];

        function toggleChatbox() {
            const chatbox = document.getElementById("chatbox");
            if (chatbox.classList.contains("open")) {
                chatbox.classList.remove("open");
                setTimeout(() => chatbox.style.display = "none", 400);
            } else {
                chatbox.style.display = "flex";
                setTimeout(() => {
                    chatbox.classList.add("open");
                    if ($("#chatlogs").children().length === 0) showGreeting();
                }, 10);
            }
        }

        function showGreeting() {
            const now = new Date();
            const hour = now.getHours();
            let greeting = "Good morning";
            if (hour >= 12) greeting = "Good afternoon";
            if (hour >= 17) greeting = "Good evening";

            const html = `
                <div class="greeting">
                    <img src="${greetingImageUrl}" class="greeting-image" alt="Welcome">
                    <div class="greeting-text">${greeting}! Welcome to eCMS.<br>How can I assist you today?</div>
                </div>
            `;
            $("#chatlogs").append(html);
            $("#highlighted-questions").show();
            scrollToBottom();
        }

        function showLoading() {
            const html = `
                <div class="message bot-wrapper" id="loading-msg">
                    <img src="${responderImageUrl}" class="responder-image" alt="Bot">
                    <div class="loading-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            $("#chatlogs").append(html);
            scrollToBottom();
        }

        function removeLoading() {
            $("#loading-msg").remove();
        }

        function addBotMessage(message) {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            // FIX: Remove markdown bolding (**text**) by replacing ** with empty string
            let cleanMessage = message.replace(/\*\*/g, '');

            const formattedMessage = cleanMessage
                .replace(/\n/g, '<br>')
                .replace(/(\d+\.)\s/g, '<strong>$1</strong> ');

            const html = `
                <div class="message bot-wrapper">
                    <img src="${responderImageUrl}" class="responder-image" alt="Bot">
                    <div>
                        <div class="bot">${formattedMessage}</div>
                        <div class="timestamp">${time}</div>
                    </div>
                </div>
            `;
            $("#chatlogs").append(html);
            scrollToBottom();
        }

        function addUserMessage(text) {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            const html = `
                <div class="message user">
                    ${text}
                    <div class="timestamp">${time}</div>
                </div>
            `;
            $("#chatlogs").append(html);
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatlogs = document.getElementById("chatlogs");
            chatlogs.scrollTop = chatlogs.scrollHeight;
        }

        function containsBadWords(text) {
            return badWords.some(word => text.toLowerCase().includes(word));
        }

        function sendMessage() {
            const userInput = $("#userInput").val().trim();
            if (!userInput) return;

            if (containsBadWords(userInput)) {
                addBotMessage("Your message contains inappropriate content. Please keep the conversation respectful.");
                disableChat();
                $("#tryAgainChat").show();
                setSendButton();
                return;
            }

            $("#userInput").val("");
            addUserMessage(userInput);
            $("#highlighted-questions").hide();
            showLoading();

            $.get("/get", { msg: userInput }, function(data) {
                removeLoading();
                addBotMessage(data.message);
                setSendButton();
            }).fail(function() {
                removeLoading();
                addBotMessage("Sorry, I'm having trouble connecting. Please try again.");
                setSendButton();
            });
        }

        function sendHighlightedQuestion(question) {
            $("#userInput").val(question);
            sendMessage();
        }

        function setSendButton() {
            const button = $("#sendStopButton");
            button.text("Send");
            button.removeClass("stopButton");
        }

        function setStopButton() {
            const button = $("#sendStopButton");
            button.text("Stop");
            button.addClass("stopButton");
        }

        function toggleSendStop() {
            const userInput = $("#userInput").val().trim();
            if (!userInput) {
                setSendButton();
                return;
            }
            
            const button = $("#sendStopButton");
            if (button.text() === "Send") {
                setStopButton();
                sendMessage();
            } else {
                setSendButton();
                removeLoading();
            }
        }

        function startVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Speech recognition not supported. Please use Chrome.");
                return;
            }

            recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                $("#userInput").val(event.results[0][0].transcript);
            };

            recognition.onend = function() {
                $("#voiceSearchButton").removeClass("active");
            };

            $("#voiceSearchButton").addClass("active");
            recognition.start();
        }

        function stopVoiceRecognition() {
            if (recognition) {
                recognition.stop();
                $("#voiceSearchButton").removeClass("active");
            }
        }

        function disableChat() {
            $("#userInput, #sendStopButton, #voiceSearchButton").prop("disabled", true);
        }

        function enableChat() {
            $("#userInput, #sendStopButton, #voiceSearchButton").prop("disabled", false);
        }

        function restartChat() {
            $("#chatlogs").empty();
            $("#userInput").val("");
            enableChat();
            $("#tryAgainChat").hide();
            showGreeting();
        }

        $(document).ready(function() {
            showGreeting();
            
            $("#userInput").keypress(function(e) {
                if (e.which === 13) {
                    e.preventDefault();
                    toggleSendStop();
                }
            });
        });
    </script>
</body>
</html>
